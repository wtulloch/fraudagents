[project]
name = "fraudagents"
version = "1.0.0"
description = "Multi-agent fraud and AML detection platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "azure-ai-agents>=1.0.0",
    "azure-ai-projects>=1.0.0b11",
    "azure-search-documents>=11.6.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.17.0",
    "openai>=1.51.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "faker>=26.0.0",
    "locust>=2.31.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv]
package = false
system-certs = true

[[tool.uv.index]]
name = "microsoft-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true
